plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.songshu.sstv'
    compileSdk 34

    defaultConfig {
        applicationId "com.songshu.sstv"
        minSdk 26
        targetSdk 34
        versionCode 17
        versionName "1.16"
        resConfigs "zh", "en"
    }

    // Release credentials are supplied through local Gradle properties.
    def releaseStoreFile = providers.gradleProperty('SSTV_STORE_FILE').orNull
    def releaseStorePassword = providers.gradleProperty('SSTV_STORE_PASSWORD').orNull
    def releaseKeyAlias = providers.gradleProperty('SSTV_KEY_ALIAS').orNull
    def releaseKeyPassword = providers.gradleProperty('SSTV_KEY_PASSWORD').orNull
    def hasReleaseSigning = [releaseStoreFile, releaseStorePassword,
                             releaseKeyAlias, releaseKeyPassword].every { it }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-opt-in=androidx.media3.common.util.UnstableApi']
    }
    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
